name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy relay Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_APP_KEY: ${{ secrets.WORKER_APP_KEY }}
        run: |
          MISSING=""
          for NAME in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN WORKER_APP_KEY; do
            if [ -z "${!NAME:-}" ]; then MISSING="$MISSING $NAME"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repository secrets:$MISSING"
            exit 1
          fi

      - name: Syntax check
        run: node --check worker/src/index.js

      - name: Worker tests
        run: node worker/test.mjs

      - name: Deploy Worker and set secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            BOT_TOKEN
            APP_KEY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_KEY: ${{ secrets.WORKER_APP_KEY }}
